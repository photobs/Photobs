  <style>
    /* Clean Dark Background */
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }

    /* Light Mode Theme */
    body.light-mode {
      background-color: #f8fafc;
      color: #0f172a;
    }
    body.light-mode .bg-card {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
    }

    .bg-card {
      background-color: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
    }

    /* Typewriter Cursor */
    .typing::after {
      content: '|';
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Transparent Author Fade-In */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 0.5; transform: translateY(0); }
    }
    .fade-in-author {
      animation: fadeIn 1.2s ease-out forwards;
    }

    /* CARD FLASH / HIGHLIGHT EFFECT */
    @keyframes cardFlash {
      0% { transform: scale(1.03); filter: brightness(1.4); box-shadow: 0 0 25px rgba(59, 130, 246, 0.8); }
      100% { transform: scale(1); filter: brightness(1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    }
    .animate-card-flash {
      animation: cardFlash 0.8s ease-out forwards;
    }

    /* DRAMATIC STAMP ZOOM & DROP ANIMATION */
    @keyframes stampZoomDrop {
      0% {
        opacity: 0;
        transform: scale(4) rotate(0deg) translateY(-30px);
      }
      50% {
        opacity: 1;
        transform: scale(1.3) rotate(-10deg) translateY(0);
      }
      75% {
        transform: scale(0.9) rotate(-18deg);
      }
      100% {
        opacity: 0.92;
        transform: scale(1) rotate(-15deg);
      }
    }

    .official-stamp {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 85px;
      height: 85px;
      pointer-events: none;
      z-index: 20;
      opacity: 0.92;
      transform: rotate(-15deg);
      filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.7));
    }

    .official-stamp.animate-stamp {
      animation: stampZoomDrop 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 10px;
    }
  </style>

  <script type="module">

    let newlyUploadedId = null;

    // DIGITAL STAMP SOUND EFFECT USING WEB AUDIO API
    function playStampSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);

        gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio not supported or blocked");
      }
    }

    // PWA INSTALL LOGIC WITH DEVICE CHECK
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {

      deferredPrompt = e;
    });

              // FIREWORKS SYSTEM
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.velocity = { x: (Math.random() - 0.5) * 6, y: (Math.random() - 0.5) * 6 };
        this.alpha = 1; this.friction = 0.98;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.015;
      }
    }

    let particles = [];
    const colors = ['#3b82f6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];

    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.5);
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 30; i++) particles.push(new Particle(x, y, color));
    }

    let isAnimatingFireworks = true;
    function animateFireworks() {
      if (!isAnimatingFireworks) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        if (p.alpha > 0) { p.update(); p.draw(); }
        else { particles.splice(idx, 1); }
      });
      requestAnimationFrame(animateFireworks);
    }

    let fireworkInterval;
    function startFireworks() {
      isAnimatingFireworks = true;
      fireworkInterval = setInterval(createFirework, 350);
      animateFireworks();
    }

    function stopFireworks() {
      isAnimatingFireworks = false;
      clearInterval(fireworkInterval);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.display = 'none';
    }

    // TYPEWRITER & SPLASH SCREEN ANIMATION
    const textToType = "Welcome to Photobs";
    let typeIndex = 0;
    const typewriterEl = document.getElementById('typewriter-text');
    const authorEl = document.getElementById('author-text');

    function startTypewriter() {
      startFireworks();
      function typeChar() {
        if (typeIndex < textToType.length) {
          typewriterEl.textContent += textToType.charAt(typeIndex);
          typeIndex++;
          setTimeout(typeChar, 100);
        } else {
          typewriterEl.classList.remove('typing');
          authorEl.classList.add('fade-in-author');
          setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = "0";
            setTimeout(() => {
              splash.style.display = "none";
              stopFireworks();
            }, 800);
          }, 1800);
        }
      }
      typeChar();
    }

    // THEME TOGGLE
    const themeBtn = document.getElementById('theme-toggle-btn');
    const themeIcon = document.getElementById('theme-icon');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      if (document.body.classList.contains('light-mode')) {
        themeIcon.className = "fa-solid fa-moon text-indigo-600";
      } else {
        themeIcon.className = "fa-solid fa-sun text-yellow-400";
      }
    });

    const uploadModal = document.getElementById('upload-modal');
    document.getElementById('open-upload-modal-btn').addEventListener('click', () => uploadModal.classList.remove('hidden'));
    document.getElementById('close-upload-modal-btn').addEventListener('click', () => uploadModal.classList.add('hidden'));

    // LIGHTBOX PREVIEW
    const lightboxModal = document.getElementById('lightbox-modal');
    const lightboxImg = document.getElementById('lightbox-img');
    document.getElementById('close-lightbox').addEventListener('click', () => lightboxModal.classList.add('hidden'));

    // UPLOAD LOGIC
    const uploadForm = document.getElementById('upload-form');
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('file-input');
      const uploaderName = currentUser ? currentUser.displayName : document.getElementById('uploader-name').value;
      const uploaderEmail = currentUser ? currentUser.email : document.getElementById('uploader-email').value;
      const picName = document.getElementById('pic-name').value;
      const picCategory = document.getElementById('pic-category').value;
      const picDesc = document.getElementById('pic-desc').value;
      const addBtn = document.getElementById('add-photo-btn');

      if (fileInput.files.length === 0) return alert('Please select a photo!');
      let file = fileInput.files[0];

      addBtn.textContent = 'Optimizing...';
      addBtn.disabled = true;

      const compressImage = async (file, maxWidth = 1024, quality = 0.7) => {
        const fileName = file.name.toLowerCase();
        if (fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic') {
          if (typeof heic2any === 'undefined') {
            throw new Error('HEIC library not loaded');
          }
          try {
            const convertPromise = heic2any({ blob: file, toType: 'image/jpeg', quality: 0.8 });
            const timeoutPromise = new Promise((_, reject) => 
              setTimeout(() => reject(new Error('HEIC conversion timeout')), 12000)
            );
            
            const blob = await Promise.race([convertPromise, timeoutPromise]);
            file = Array.isArray(blob) ? blob[0] : blob;
          } catch (err) {
            console.error("HEIC conversion error:", err);
            throw new Error("Could not process HEIC image. Please select a JPG or PNG image.");
          }
        }

        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('File read error'));
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.onerror = () => reject(new Error('Image load error'));
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;

              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
              resolve(compressedDataUrl);
            };
          };
        });
      };

      try {
        addBtn.textContent = 'Processing...';
        const base64String = await compressImage(file, 1024, 0.7);

        const mid = Math.floor(base64String.length / 2);
        const imagePart1 = base64String.substring(0, mid);
        const imagePart2 = base64String.substring(mid);

        addBtn.textContent = 'Uploading...';

        const docRef = await addDoc(collection(db, "photos"), {
          imagePart1,
          imagePart2,
          uploaderName,
          uploaderEmail,
          picName,
          picCategory,
          picDesc,
          likes: 0,
          comments: [],
          timestamp: new Date()
        });

        newlyUploadedId = docRef.id;

        uploadForm.reset();
        uploadModal.classList.add('hidden');
        loadPhotos();
      } catch (error) {
        console.error("Upload error: ", error);
        alert(error.message || 'Failed to upload photo.');
      } finally {
        addBtn.textContent = 'Upload Photo';
        addBtn.disabled = false;
      }
    });

    // CATEGORY & SEARCH FILTER STATE
    let currentCategory = 'all';
    let searchQuery = '';

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.category-btn').forEach(b => {
          b.classList.remove('bg-blue-600', 'text-white');
          b.classList.add('bg-slate-800/80', 'text-slate-300', 'border', 'border-slate-700');
        });
        const target = e.currentTarget;
        target.classList.remove('bg-slate-800/80', 'text-slate-300', 'border', 'border-slate-700');
        target.classList.add('bg-blue-600', 'text-white');
        currentCategory = target.getAttribute('data-cat');
        loadPhotos();
      });
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      loadPhotos();
    });

    // LOAD & RENDER PHOTOS WITH CARD FLASH AND STAMP SOUND ANIMATION
    async function loadPhotos() {
      const grid = document.getElementById('photo-grid');
      grid.innerHTML = '<p class="col-span-full text-center text-slate-400">Loading photos...</p>';

      try {
        const querySnapshot = await getDocs(collection(db, "photos"));
        grid.innerHTML = '';

        let photosArray = [];
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          let imageUrl = "";
          if (data.imagePart1 && data.imagePart2) {
            imageUrl = data.imagePart1 + data.imagePart2;
          } else if (data.imageUrl) {
            imageUrl = data.imageUrl;
          }
          photosArray.push({ id: docSnap.id, ...data, imageUrl });
        });

        const filteredPhotos = photosArray.filter(photo => {
          const matchesCategory = (currentCategory === 'all' || photo.picCategory === currentCategory);
          const matchesSearch = (
            (photo.picName && photo.picName.toLowerCase().includes(searchQuery)) ||
            (photo.picCategory && photo.picCategory.toLowerCase().includes(searchQuery)) ||
            (photo.uploaderName && photo.uploaderName.toLowerCase().includes(searchQuery)) ||
            (photo.picDesc && photo.picDesc.toLowerCase().includes(searchQuery))
          );
          return matchesCategory && matchesSearch;
        });

        if (filteredPhotos.length === 0) {
          grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10">No photos found in this category or search!</p>';
          return;
        }

        filteredPhotos.forEach((photo) => {
          const photoId = photo.id;
          const isJustUploaded = (photoId === newlyUploadedId);

          const card = document.createElement('div');
          card.className = `bg-card rounded-2xl overflow-hidden shadow-xl border border-slate-700/50 flex flex-col relative ${isJustUploaded ? 'animate-card-flash' : ''}`;
          card.innerHTML = `
            <div class="relative group h-48 overflow-hidden bg-slate-950 cursor-pointer">
              <img src="${photo.imageUrl}" alt="${photo.picName}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 preview-trigger">
              <span class="absolute top-2 right-2 px-2.5 py-1 text-[10px] uppercase font-bold tracking-wider bg-black/60 backdrop-blur-md rounded-full text-blue-300">${photo.picCategory}</span>
              
              <!-- STAMP IMAGE WITH SOUND & ZOOM DROP ANIMATION -->
              <img src="stamp.png" alt="Authorized Stamp" class="official-stamp ${isJustUploaded ? 'opacity-0' : ''}" ${isJustUploaded ? 'onload="this.classList.add(\'animate-stamp\'); this.classList.remove(\'opacity-0\'); playStampSound();"' : ''}>
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
              <div>
                <div class="flex items-start justify-between">
                  <h4 class="font-bold text-lg text-white truncate">${photo.picName}</h4>
                  <button class="text-xs text-red-400 hover:text-red-300 delete-btn" data-email="${photo.uploaderEmail}" title="Delete Photo">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
                <p class="text-xs text-slate-400">By ${photo.uploaderName}</p>
                <p class="text-xs text-slate-300 mt-1 line-clamp-2">${photo.picDesc || 'No description'}</p>
              </div>

              <!-- Comments Section Box -->
              <div class="comment-section hidden space-y-2 pt-2 border-t border-slate-700/50">
                <div class="max-h-24 overflow-y-auto space-y-1 text-xs text-slate-300 comment-list">
                  ${(photo.comments || []).map(c => `<p class="bg-slate-800/80 p-1 rounded"><strong>${c.user}:</strong>${c.text}</p>`).join('') || '<p class="text-slate-500">No comments yet.</p>'}
                </div>
                <div class="flex gap-1">
                  <input type="text" placeholder="Write comment..." class="flex-1 px-2 py-1 text-xs rounded bg-slate-800 border border-slate-700 text-white comment-input">
                  <button class="px-3 py-1 text-xs bg-blue-600 text-white rounded send-comment-btn">Post</button>
                </div>
              </div>

              <div class="flex items-center justify-between pt-2 border-t border-slate-700/50 text-sm text-slate-300">
                <button class="flex items-center gap-1.5 hover:text-red-500 transition like-btn">
                  <i class="fa-solid fa-heart text-red-500"></i> <span>${photo.likes || 0}</span>
                </button>
                <button class="flex items-center gap-1.5 hover:text-blue-400 transition toggle-comment-btn">
                  <i class="fa-regular fa-comment"></i> <span>${photo.comments ? photo.comments.length : 0}</span>
                </button>
                <a href="${photo.imageUrl}" download="${photo.picName || 'photo'}.jpg" class="flex items-center gap-1.5 hover:text-emerald-400 transition" title="Download Photo">
                  <i class="fa-solid fa-download"></i>
                </a>
                <button class="flex items-center gap-1.5 hover:text-indigo-400 transition share-btn" data-name="${photo.picName}">
                  <i class="fa-solid fa-share-nodes"></i>
                </button>
              </div>
            </div>
          `;

          card.querySelector('.preview-trigger').addEventListener('click', () => {
            lightboxImg.src = photo.imageUrl;
            lightboxModal.classList.remove('hidden');
          });

          card.querySelector('.like-btn').addEventListener('click', async () => {
            const docRef = doc(db, "photos", photoId);
            await updateDoc(docRef, { likes: increment(1) });
            loadPhotos();
          });

          card.querySelector('.toggle-comment-btn').addEventListener('click', () => {
            card.querySelector('.comment-section').classList.toggle('hidden');
          });

          card.querySelector('.send-comment-btn').addEventListener('click', async () => {
            const input = card.querySelector('.comment-input');
            const text = input.value.trim();
            if (!text) return;
            const userName = currentUser ? currentUser.displayName : (prompt("Enter your name for comment:") || "Guest");
            const docRef = doc(db, "photos", photoId);
            await updateDoc(docRef, {
              comments: arrayUnion({ user: userName, text: text })
            });
            loadPhotos();
          });

          card.querySelector('.delete-btn').addEventListener('click', async (e) => {
            const uploaderEmail = e.currentTarget.getAttribute('data-email');
            const enteredEmail = currentUser ? currentUser.email : prompt("Enter the uploader's Gmail to delete this photo:");
            if (enteredEmail === uploaderEmail) {
              if (confirm("Are you sure you want to delete this photo?")) {
                await deleteDoc(doc(db, "photos", photoId));
                alert('Photo deleted successfully!');
                loadPhotos();
              }
            } else if (enteredEmail !== null) {
              alert('Incorrect Gmail! You cannot delete this photo.');
            }
          });

          card.querySelector('.share-btn').addEventListener('click', (e) => {
            const title = e.currentTarget.getAttribute('data-name');
            if (navigator.share) {
              navigator.share({ title: title, url: window.location.href });
            } else {
              navigator.clipboard.writeText(window.location.href);
              alert('Link copied to clipboard!');
            }
          });

          grid.appendChild(card);
        });

        newlyUploadedId = null;

      } catch (error) {
        console.error("Error loading photos: ", error);
        grid.innerHTML = '<p class="col-span-full text-center text-red-400">Error loading photos from database.</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      startTypewriter();
      loadPhotos();
    });
  </script>
</body>
</html>
