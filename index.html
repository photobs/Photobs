<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobs</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
    }

    body.dark-mode {
      --bg-color: #ffffff;
      --card-bg: #f6f8fa;
      --text-color: #24292e;
      --accent-color: #0366d6;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }

    #splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 9999;
    }

    #typewriter-text { font-size: 2rem; color: #fff; margin-bottom: 10px; }
    #author-text { font-size: 1rem; color: #888; opacity: 0; transition: opacity 1s; }

    #fireworks {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 9998;
    }

    header {
      padding: 20px; text-align: center;
      border-bottom: 1px solid #30363d;
    }

    .controls {
      display: flex; justify-content: center;
      gap: 10px; margin-top: 15px; flex-wrap: wrap;
    }

    input[type="text"] {
      padding: 8px 12px; border-radius: 6px;
      border: 1px solid #30363d; background: #21262d;
      color: #fff; outline: none;
    }

    button {
      padding: 8px 16px; border-radius: 6px;
      border: none; background: var(--accent-color);
      color: #fff; cursor: pointer; font-weight: bold;
    }

    #photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; padding: 20px;
    }

    .photo-card {
      background: var(--card-bg); border-radius: 8px;
      overflow: hidden; border: 1px solid #30363d;
      display: flex; flex-direction: column;
    }

    .photo-card img {
      width: 100%; height: 200px;
      object-fit: cover;
    }

    .photo-info { padding: 15px; }

    .modal {
      display: none; position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center; align-items: center; z-index: 10000;
    }

    .modal-content {
      background: var(--card-bg); padding: 20px;
      border-radius: 8px; width: 90%; max-width: 400px;
      display: flex; flex-direction: column; gap: 10px;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div id="typewriter-text"></div>
    <div id="author-text">Created by Souptik</div>
  </div>

  <canvas id="fireworks"></canvas>

  <header>
    <h1>Photobs</h1>
    <div class="controls">
      <input type="text" id="search-input" placeholder="Search photos...">
      <button id="open-upload-btn">Upload Photo</button>
      <button id="theme-btn">☀️ Light Mode</button>
    </div>
  </header>

  <main>
    <div id="photo-grid"></div>
  </main>

  <div id="upload-modal" class="modal">
    <div class="modal-content">
      <h2>Upload Photo</h2>
      <form id="upload-form">
        <input type="file" id="photo-file" accept="image/*" required><br><br>
        <input type="text" id="photo-title" placeholder="Photo Title"><br><br>
        <input type="text" id="photo-desc" placeholder="Description"><br><br>
        <input type="text" id="uploader-name" placeholder="Your Name"><br><br>
        <button type="submit" id="submit-photo-btn">Add Photo</button>
        <button type="button" onclick="document.getElementById('upload-modal').style.display='none'">Cancel</button>
      </form>
    </div>
  </div>

  <audio id="bg-music" loop src=""></audio>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxShbUK0FYH9RemIFavIx_SxQaLlUIA",
      authDomain: "photobs-ffead.firebaseapp.com",
      projectId: "photobs-ffead",
      storageBucket: "photobs-ffead.appspot.com",
      messagingSenderId: "1097325859601",
      appId: "1:1097325859601:web:c68130d361621c5952b2b0",
      measurementId: "G-PX18D6DJFE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadPhotos() {
      const photoGrid = document.getElementById('photo-grid');
      if (!photoGrid) return;
      photoGrid.innerHTML = '';

      try {
        const querySnapshot = await getDocs(collection(db, "photos"));
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.innerHTML = `
            <img src="${data.url}" alt="${data.title || 'Photo'}" loading="lazy">
            <div class="photo-info">
              <h3>${data.title || 'Untitled'}</h3>
              <p>${data.desc || ''}</p>
              <small>By: ${data.uploader || 'Anonymous'}</small>
            </div>
          `;
          photoGrid.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading photos: ", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadPhotos);

    const uploadForm = document.getElementById('upload-form');
    if (uploadForm) {
      uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('photo-file');
        const titleInput = document.getElementById('photo-title');
        const descInput = document.getElementById('photo-desc');
        const uploaderInput = document.getElementById('uploader-name');
        const submitBtn = document.getElementById('submit-photo-btn');

        if (!fileInput || !fileInput.files[0]) {
          alert("Please select a photo first!");
          return;
        }

        const file = fileInput.files[0];
        if (submitBtn) {
          submitBtn.innerText = "Uploading...";
          submitBtn.disabled = true;
        }

        const reader = new FileReader();
        reader.onload = async function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = async function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

            try {
              await addDoc(collection(db, "photos"), {
                url: compressedBase64,
                title: titleInput ? titleInput.value : '',
                desc: descInput ? descInput.value : '',
                uploader: uploaderInput ? uploaderInput.value : 'Anonymous',
                createdAt: new Date()
              });

              alert("Photo uploaded successfully!");
              if (uploadForm) uploadForm.reset();
              const modal = document.getElementById('upload-modal');
              if (modal) modal.style.display = 'none';
              
              loadPhotos();
            } catch (err) {
              console.error(err);
              alert("Upload failed! Check console or Firestore rules.");
            } finally {
              if (submitBtn) {
                submitBtn.innerText = "Add Photo";
                submitBtn.disabled = false;
              }
            }
          };
        };
        reader.readAsDataURL(file);
      });
    }
    </script>
        <script>
    const textToType = "Welcome to Photobs";
    let typeIndex = 0;
    const typewriterEl = document.getElementById('typewriter-text');
    const authorEl = document.getElementById('author-text');

    function typeWriter() {
      if (typeIndex < textToType.length) {
        typewriterEl.innerHTML += textToType.charAt(typeIndex);
        typeIndex++;
        setTimeout(typeWriter, 100);
      } else {
        if(authorEl) authorEl.style.opacity = "1";
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if(splash) {
            splash.style.transition = "opacity 0.8s ease";
            splash.style.opacity = "0";
            setTimeout(() => {
              splash.style.display = "none";
              // Ekhane splash screen jawar por fireworks shuru hobe
              setInterval(createFirework, 400);
            }, 800);
          }
        }, 1500);
      }
    }

    const canvas = document.getElementById('fireworks');
    const ctx = canvas ? canvas.getContext('2d') : null;
    if(canvas) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.velocity = { x: (Math.random() - 0.5) * 6, y: (Math.random() - 0.5) * 6 };
        this.alpha = 1; this.friction = 0.98;
      }
      draw() {
        if(!ctx) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.015;
      }
    }

    let particles = [];
    const colors = ['#ff0055', '#00ffff', '#ffff00', '#00ff66', '#ff9900'];

    function createFirework() {
      if(!canvas) return;
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.6);
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 30; i++) particles.push(new Particle(x, y, color));
    }

    function animateFireworks() {
      if(!ctx) return;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        if (p.alpha > 0) { p.update(); p.draw(); }
        else { particles.splice(idx, 1); }
      });
      requestAnimationFrame(animateFireworks);
    }

    window.addEventListener('DOMContentLoaded', () => {
      typeWriter();
      animateFireworks();
    });

    const themeBtn = document.getElementById('theme-btn');
    if(themeBtn) {
      themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        themeBtn.innerText = document.body.classList.contains('dark-mode') ? "☀️ Light Mode" : "🌙 Dark Mode";
      });
    }

    const searchInput = document.getElementById('search-input');
    if(searchInput) {
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const cards = document.querySelectorAll('.photo-card');
        cards.forEach(card => {
          const text = card.innerText.toLowerCase();
          card.style.display = text.includes(query) ? "flex" : "none";
        });
      });
    }

    const openBtn = document.getElementById('open-upload-btn');
    if(openBtn) {
      openBtn.addEventListener('click', () => {
        document.getElementById('upload-modal').style.display = "flex";
      });
    }
        </script>
  </body>
</html>
