<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobs</title>
  
  <!-- PWA & App Icons -->
  <link rel="icon" type="image/png" href="image.png">
  <link rel="apple-touch-icon" href="image.png">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Unique Dynamic Animated Background */
    body {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0284c7);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f8fafc;
      min-height: 100vh;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Light Mode Theme */
    body.light-mode {
      background: #f8fafc;
      color: #0f172a;
    }
    body.light-mode .bg-card {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
    }
    body.light-mode .text-muted {
      color: #64748b;
    }

    .bg-card {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
    }

    /* Typewriter Cursor */
    .typing::after {
      content: '|';
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 10px;
    }
  </style>
</head>
<body class="transition-colors duration-300 flex flex-col relative min-h-screen">

  <!-- SPLASH SCREEN -->
  <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 text-white transition-opacity duration-800">
    <div class="text-center px-4">
      <h1 id="typewriter-text" class="text-3xl md:text-5xl font-extrabold tracking-wider text-blue-400 mb-3 typing"></h1>
      <p id="author-text" class="text-lg md:text-xl text-white/40 opacity-0 transition-opacity duration-1000 font-medium">
        Created by <span class="text-blue-400 font-semibold">Souptik Panda</span>
      </p>
    </div>
  </div>

  <!-- FIREWORKS CANVAS -->
  <canvas id="fireworks-canvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

  <!-- NAVBAR / HEADER -->
  <header class="sticky top-0 z-30 bg-slate-900/85 backdrop-blur-md border-b border-slate-700/50 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <img src="image.png" alt="Photobs Logo" class="w-10 h-10 rounded-xl shadow-md object-cover border border-blue-500/30">
        <span class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Photobs</span>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md mx-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" placeholder="Search photos or categories..." 
            class="w-full pl-10 pr-4 py-2 text-sm rounded-full bg-slate-800/80 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-slate-400">
        </div>
      </div>

      <!-- Action Buttons & Custom Install Options -->
      <div class="flex items-center gap-2">
        <!-- Favorites Button -->
        <button id="fav-filter-btn" title="Show Favorites" class="p-2.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">
          <i class="fa-solid fa-heart text-red-500"></i>
        </button>

        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" title="Toggle Theme" class="p-2.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">
          <i class="fa-solid fa-sun text-yellow-400"></i>
        </button>

        <!-- Install Mobile Button -->
        <button id="install-mobile-btn" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition" title="Install for Mobile">
          <i class="fa-solid fa-mobile-screen"></i> <span>Mobile</span>
        </button>

        <!-- Install PC Button -->
        <button id="install-pc-btn" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition" title="Install for PC">
          <i class="fa-solid fa-laptop"></i> <span>PC</span>
        </button>
      </div>
    </div>

    <!-- Category Filters -->
    <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto py-2 mt-2 text-xs font-medium">
      <button class="category-btn active px-3 py-1.5 rounded-full bg-blue-600 text-white" data-cat="all">All</button>
      <button class="category-btn px-3 py-1.5 rounded-full bg-slate-800/80 text-slate-300 border border-slate-700" data-cat="nature">Nature</button>
      <button class="category-btn px-3 py-1.5 rounded-full bg-slate-800/80 text-slate-300 border border-slate-700" data-cat="sports">Sports</button>
      <button class="category-btn px-3 py-1.5 rounded-full bg-slate-800/80 text-slate-300 border border-slate-700" data-cat="technology">Technology</button>
      <button class="category-btn px-3 py-1.5 rounded-full bg-slate-800/80 text-slate-300 border border-slate-700" data-cat="people">People</button>
    </div>
  </header>

  <!-- MAIN GALLERY GRID -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <div id="photo-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Photos will be loaded dynamically here -->
    </div>
  </main>

  <!-- FLOATING "+" BUTTON FOR UPLOAD -->
  <button id="open-upload-modal-btn" class="fixed bottom-6 right-6 z-30 w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-xl flex items-center justify-center text-2xl transition-transform hover:scale-105 active:scale-95">
    <i class="fa-solid fa-plus"></i>
  </button>
    <!-- UPLOAD MODAL -->
  <div id="upload-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden px-4">
    <div class="bg-slate-900 border border-slate-700 bg-card w-full max-w-lg rounded-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-bold mb-4 text-white">Upload New Photo</h3>
      
      <form id="upload-form" class="space-y-4 text-slate-200">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Choose Photo</label>
          <input type="file" id="file-input" accept="image/*" required class="w-full text-sm border rounded-lg p-2 bg-slate-800 border-slate-700 text-slate-300">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Uploader Name</label>
          <input type="text" id="uploader-name" placeholder="Souptik Panda" required class="w-full px-3 py-2 text-sm border rounded-lg bg-slate-800 border-slate-700 text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Uploader Gmail</label>
          <input type="email" id="uploader-email" placeholder="example@gmail.com" required class="w-full px-3 py-2 text-sm border rounded-lg bg-slate-800 border-slate-700 text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Picture Name</label>
          <input type="text" id="pic-name" placeholder="Beautiful Sunset" required class="w-full px-3 py-2 text-sm border rounded-lg bg-slate-800 border-slate-700 text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Category</label>
          <select id="pic-category" class="w-full px-3 py-2 text-sm border rounded-lg bg-slate-800 border-slate-700 text-white">
            <option value="nature">Nature</option>
            <option value="sports">Sports</option>
            <option value="technology">Technology</option>
            <option value="people">People</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Description</label>
          <textarea id="pic-desc" rows="3" placeholder="Write description..." class="w-full px-3 py-2 text-sm border rounded-lg bg-slate-800 border-slate-700 text-white"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-3">
          <button type="button" id="close-upload-modal-btn" class="px-4 py-2 text-sm font-medium rounded-lg border border-slate-700 hover:bg-slate-800">Cancel</button>
          <button type="submit" id="add-photo-btn" class="px-5 py-2 text-sm font-medium rounded-lg bg-blue-600 hover:bg-blue-700 text-white">Upload Photo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FIREBASE & MAIN APP LOGIC SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBxbShbUK0fYHY9RemIFavIx...",
      authDomain: "photobs-ffead.firebaseapp.com",
      projectId: "photobs-ffead",
      storageBucket: "photobs-ffead.appspot.com",
      messagingSenderId: "1097325859601",
      appId: "1:1097325859601:web:c68130d361621c5952b2b0",
      measurementId: "G-PX18D6DJFE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // PWA INSTALL LOGIC FOR MOBILE & PC
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    const triggerInstall = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User accepted the install prompt');
        }
        deferredPrompt = null;
      } else {
        alert('App is ready! If prompt does not show, use your browser menu (Chrome Menu -> "Install App" or "Add to Home screen").');
      }
    };

    document.getElementById('install-mobile-btn').addEventListener('click', triggerInstall);
    document.getElementById('install-pc-btn').addEventListener('click', triggerInstall);

    // TYPEWRITER & SPLASH SCREEN
    const textToType = "Welcome to Photobs";
    let typeIndex = 0;
    const typewriterEl = document.getElementById('typewriter-text');
    const authorEl = document.getElementById('author-text');

    function startTypewriter() {
      if (typeIndex < textToType.length) {
        typewriterEl.textContent += textToType.charAt(typeIndex);
        typeIndex++;
        setTimeout(startTypewriter, 100);
      } else {
        typewriterEl.classList.remove('typing');
        authorEl.style.opacity = "1";
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          splash.style.opacity = "0";
          setTimeout(() => {
            splash.style.display = "none";
            startFireworks();
          }, 800);
        }, 1500);
      }
    }

    // FIREWORKS SYSTEM
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.velocity = { x: (Math.random() - 0.5) * 6, y: (Math.random() - 0.5) * 6 };
        this.alpha = 1; this.friction = 0.98;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.015;
      }
    }

    let particles = [];
    const colors = ['#3b82f6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];

    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.5);
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 30; i++) particles.push(new Particle(x, y, color));
    }

    function animateFireworks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        if (p.alpha > 0) { p.update(); p.draw(); }
        else { particles.splice(idx, 1); }
      });
      requestAnimationFrame(animateFireworks);
    }

    function startFireworks() {
      let interval = setInterval(createFirework, 400);
      setTimeout(() => clearInterval(interval), 4000);
      animateFireworks();
    }

    // UI CONTROLS & MODAL
    const themeBtn = document.getElementById('theme-toggle-btn');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
    });

    const uploadModal = document.getElementById('upload-modal');
    document.getElementById('open-upload-modal-btn').addEventListener('click', () => uploadModal.classList.remove('hidden'));
    document.getElementById('close-upload-modal-btn').addEventListener('click', () => uploadModal.classList.add('hidden'));

    // UPLOAD & FIRESTORE LOGIC
    const uploadForm = document.getElementById('upload-form');
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('file-input');
      const uploaderName = document.getElementById('uploader-name').value;
      const uploaderEmail = document.getElementById('uploader-email').value;
      const picName = document.getElementById('pic-name').value;
      const picCategory = document.getElementById('pic-category').value;
      const picDesc = document.getElementById('pic-desc').value;
      const addBtn = document.getElementById('add-photo-btn');

      if (fileInput.files.length === 0) return alert('Please select a photo!');
      const file = fileInput.files[0];

      addBtn.textContent = 'Uploading...';
      addBtn.disabled = true;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async () => {
        try {
          // Saving image base64 & details into Firestore collection 'photos'
          await addDoc(collection(db, "photos"), {
            imageUrl: reader.result,
            uploaderName,
            uploaderEmail,
            picName,
            picCategory,
            picDesc,
            likes: 0,
            likedUsers: [],
            comments: [],
            timestamp: new Date()
          });

          alert('Photo uploaded successfully!');
          uploadForm.reset();
          uploadModal.classList.add('hidden');
          loadPhotos();
        } catch (error) {
          console.error("Error uploading photo: ", error);
          alert('Failed to upload photo. Please check console.');
        } finally {
          addBtn.textContent = 'Upload Photo';
          addBtn.disabled = false;
        }
      };
    });

    // FETCH AND DISPLAY PHOTOS FROM FIRESTORE
    async function loadPhotos() {
      const grid = document.getElementById('photo-grid');
      grid.innerHTML = '<p class="col-span-full text-center text-slate-400">Loading photos...</p>';

      try {
        const querySnapshot = await getDocs(collection(db, "photos"));
        grid.innerHTML = '';

        if (querySnapshot.empty) {
          grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10">No photos uploaded yet. Click the + button to add one!</p>';
          return;
        }

        querySnapshot.forEach((documentSnapshot) => {
          const photo = documentSnapshot.data();
          const photoId = documentSnapshot.id;

          const card = document.createElement('div');
          card.className = "bg-card rounded-2xl overflow-hidden shadow-xl border border-slate-700/50 flex flex-col";
          card.innerHTML = `
            <div class="relative group h-48 overflow-hidden bg-slate-950">
              <img src="${photo.imageUrl}" alt="${photo.picName}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
              <span class="absolute top-2 right-2 px-2.5 py-1 text-[10px] uppercase font-bold tracking-wider bg-black/60 backdrop-blur-md rounded-full text-blue-300">${photo.picCategory}</span>
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
              <div>
                <h4 class="font-bold text-lg text-white truncate">${photo.picName}</h4>
                <p class="text-xs text-slate-400">By ${photo.uploaderName}</p>
                <p class="text-xs text-slate-300 mt-1 line-clamp-2">${photo.picDesc || 'No description'}</p>
              </div>
              <div class="flex items-center justify-between pt-2 border-t border-slate-700/55 text-sm text-slate-300">
                <button class="flex items-center gap-1.5 hover:text-red-500 transition like-btn" data-id="${photoId}">
                  <i class="fa-regular fa-heart"></i> <span>${photo.likes || 0}</span>
                </button>
                <button class="flex items-center gap-1.5 hover:text-blue-400 transition comment-btn">
                  <i class="fa-regular fa-comment"></i> <span>${photo.comments ? photo.comments.length : 0}</span>
                </button>
                <button class="flex items-center gap-1.5 hover:text-emerald-400 transition share-btn" data-name="${photo.picName}">
                  <i class="fa-solid fa-share-nodes"></i>
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

        // Add Share Action
        document.querySelectorAll('.share-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const title = e.currentTarget.getAttribute('data-name');
            if (navigator.share) {
              navigator.share({ title: title, url: window.location.href });
            } else {
              navigator.clipboard.writeText(window.location.href);
              alert('Link copied to clipboard!');
            }
          });
        });

      } catch (error) {
        console.error("Error loading photos: ", error);
        grid.innerHTML = '<p class="col-span-full text-center text-red-400">Error loading photos from database.</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      startTypewriter();
      loadPhotos();
    });
  </script>
</body>
</html>
