<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobs - Photo Sharing Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: #121212;
      color: #fff;
    }

    /* --- Splash Screen --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #080810;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      overflow: hidden;
    }

    canvas#fireworks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .splash-content {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .splash-logo-box {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #00dfd8, #7928ca, #ff0080);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(255, 0, 128, 0.6);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 128, 0.5); }
      100% { transform: scale(1.08); box-shadow: 0 0 40px rgba(0, 223, 216, 0.8); }
    }

    .splash-logo-box svg {
      width: 50px;
      height: 50px;
      fill: #ffffff;
    }

    .splash-title {
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: bold;
      min-height: 50px;
      text-shadow: 0 0 15px rgba(0,255,255,0.5);
    }

    .splash-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.05rem;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    /* --- Header / Navbar --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 5%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      gap: 15px;
    }

    body.dark-mode header {
      background: rgba(20, 20, 20, 0.92);
      box-shadow: 0 2px 12px rgba(255,255,255,0.05);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #00dfd8, #7928ca, #ff0080);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(121, 40, 202, 0.5);
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .logo-text {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ff0080, #7928ca, #00dfd8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-container {
      flex: 1;
      max-width: 380px;
      margin: 0 10px;
    }

    .search-input {
      width: 100%;
      padding: 9px 18px;
      border-radius: 25px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 0.92rem;
      background: #f0f2f5;
    }

    body.dark-mode .search-input {
      background: #2a2a2a;
      border-color: #444;
      color: #fff;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: linear-gradient(135deg, #ff0080, #7928ca);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(255, 0, 128, 0.3);
      transition: transform 0.2s;
    }

    .btn-icon:hover {
      transform: scale(1.08);
    }

    .toggle-btn {
      background: none;
      border: 1px solid #ccc;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.88rem;
      color: inherit;
    }

    /* --- Category Filter Bar --- */
    .filter-bar {
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .filter-chip {
      background: #e4e6eb;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      transition: 0.2s;
    }

    body.dark-mode .filter-chip {
      background: #2a2a2a;
      color: #ddd;
    }

    .filter-chip.active, .filter-chip:hover {
      background: linear-gradient(135deg, #ff0080, #7928ca);
      color: white;
    }

    /* --- Gallery Grid --- */
    .container {
      max-width: 1200px;
      margin: 20px auto 40px;
      padding: 0 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .photo-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .photo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    body.dark-mode .photo-card {
      background: #1e1e1e;
    }

    .photo-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .photo-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .photo-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: inherit;
    }

    .photo-desc {
      font-size: 0.88rem;
      color: #666;
      line-height: 1.3;
    }

    body.dark-mode .photo-desc {
      color: #aaa;
    }

    .photo-author {
      font-size: 0.8rem;
      color: #ff0080;
      font-weight: 500;
    }

    .category-tag {
      display: inline-block;
      background: rgba(121, 40, 202, 0.1);
      color: #7928ca;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      width: fit-content;
    }

    /* Card Actions */
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    body.dark-mode .card-actions {
      border-top-color: #333;
    }

    .action-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .like-btn, .share-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      color: inherit;
      font-weight: 600;
    }

    .like-btn.liked {
      color: #ff0080;
    }

    .download-btn {
      background: #007bff;
      color: white;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* Comments Section */
    .comments-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #ddd;
      font-size: 0.82rem;
    }

    body.dark-mode .comments-section {
      border-top-color: #333;
    }

    .comments-list {
      max-height: 80px;
      overflow-y: auto;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .comment-item {
      background: #f0f2f5;
      padding: 4px 8px;
      border-radius: 4px;
    }

    body.dark-mode .comment-item {
      background: #2a2a2a;
    }

    .comment-input-box {
      display: flex;
      gap: 5px;
    }

    .comment-input {
      flex: 1;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.78rem;
      outline: none;
    }

    body.dark-mode .comment-input {
      background: #222;
      border-color: #444;
      color: #fff;
    }

    .comment-submit-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 14px;
      width: 90%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body.dark-mode .modal-content {
      background: #222;
      color: #fff;
    }

    .modal-content input, .modal-content textarea, .modal-content select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 0.9rem;
    }

    body.dark-mode .modal-content input, body.dark-mode .modal-content textarea, body.dark-mode .modal-content select {
      background: #333;
      border-color: #555;
      color: #fff;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-submit {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-cancel {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    #fullview-modal img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }

    #loading-msg {
      text-align: center;
      font-size: 1.1rem;
      color: #777;
      grid-column: 1 / -1;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <canvas id="fireworks"></canvas>
    <div class="splash-content">
      <div class="splash-logo-box">
        <!-- Exact Camera SVG Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
        </svg>
      </div>
      <h1 class="splash-title" id="typewriter-text"></h1>
      <p class="splash-subtitle" id="author-text">Created by Souptik Panda</p>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand-container" onclick="filterCategory('All')">
      <div class="brand-icon">
        <!-- Exact Camera SVG Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
        </svg>
      </div>
      <div class="logo-text">Photobs</div>
    </div>

    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Search photos or uploader...">
    </div>

    <div class="nav-controls">
      <button id="install-btn" class="toggle-btn" style="display: none; background: #28a745; color: white; border: none; font-weight: bold;">
        📲 Android App
      </button>

      <button id="pc-install-btn" class="toggle-btn" onclick="alert('Open this website in Google Chrome or Microsoft Edge on your PC, then click the Install button in the browser address bar to use it as a Desktop App!')" style="background: #007bff; color: white; border: none; font-weight: bold;">
        💻 PC Version
      </button>

      <button class="btn-icon" id="open-upload-btn" title="Upload Photo">+</button>
      <button class="toggle-btn" id="theme-btn">🌙 Dark Mode</button>
    </div>
  </header>

  <!-- Category Filter Bar -->
  <div class="filter-bar" id="filter-bar">
    <button class="filter-chip active" onclick="filterCategory('All')">🌟 All</button>
    <button class="filter-chip" onclick="filterCategory('Nature')">🌿 Nature</button>
    <button class="filter-chip" onclick="filterCategory('Portrait')">👤 Portrait</button>
    <button class="filter-chip" onclick="filterCategory('Travel')">✈️ Travel</button>
    <button class="filter-chip" onclick="filterCategory('Animation')">🎬 Animation</button>
    <button class="filter-chip" onclick="filterCategory('Others')">📌 Others</button>
  </div>

  <!-- Gallery -->
  <div class="container">
    <div class="gallery-grid" id="gallery">
      <div id="loading-msg">Loading photos...</div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal">
    <div class="modal-content">
      <h3>Upload New Photo</h3>
      <input type="file" id="photo-file" accept="image/*">
      <input type="text" id="uploader-name" placeholder="Your Name...">
      <input type="email" id="uploader-email" placeholder="Your Email...">
      <input type="text" id="photo-title-input" placeholder="Photo Title...">
      <select id="photo-category">
        <option value="Nature">Nature</option>
        <option value="Portrait">Portrait</option>
        <option value="Travel">Travel</option>
        <option value="Animation">Animation</option>
        <option value="Others" selected>Others</option>
      </select>
      <textarea id="photo-desc-input" rows="2" placeholder="Photo Description..."></textarea>
      <div class="modal-buttons">
        <button class="btn-cancel" id="close-upload-btn">Cancel</button>
        <button class="btn-submit" id="submit-photo-btn">Add Photo</button>
      </div>
    </div>
  </div>

  <!-- Full Image View Modal -->
  <div id="fullview-modal" class="modal" onclick="this.style.display='none'">
    <img id="full-image-src" src="" alt="Full View">
  </div>

  <!-- Background Music -->
  <audio id="bg-music" src="channa.mp3"></audio>

  <!-- Gallery Script -->
  <script>
    let currentCategory = 'All';
    const gallery = document.getElementById('gallery');
    
    function loadPhotos() {
      const photos = JSON.parse(localStorage.getItem('photobs_photos')) || [];
      gallery.innerHTML = "";

      const filteredPhotos = photos.filter(photo => {
        if (currentCategory === 'All') return true;
        return (photo.category || 'Others') === currentCategory;
      });

      if (filteredPhotos.length === 0) {
        gallery.innerHTML = "<div id='loading-msg'>No photos found in this category. Click '+' to upload!</div>";
        return;
      }

      filteredPhotos.forEach((photo) => {
        const realIndex = photos.findIndex(p => p.timestamp === photo.timestamp);
        
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.setAttribute('data-category', photo.category || 'Others');
        
        let commentsHtml = '';
        if (photo.comments && photo.comments.length > 0) {
          photo.comments.forEach(c => {
            commentsHtml += `<div class="comment-item"><b>${c.name}:</b> ${c.text}</div>`;
          });
        } else {
          commentsHtml = `<div class="comment-item" style="color:#888;">No comments yet.</div>`;
        }

        card.innerHTML = `
          <img src="${photo.imageUrl}" alt="${photo.title}" onclick="openFullImage('${photo.imageUrl}')">
          <div class="photo-info">
            <span class="category-tag">${photo.category || 'Others'}</span>
            <div class="photo-title">${photo.title}</div>
            <div class="photo-desc">${photo.desc}</div>
            <div class="photo-author">👤 ${photo.uploaderName || 'Anonymous'} (${photo.uploaderEmail || 'No Email'})</div>
            
            <div class="card-actions">
              <div class="action-group">
                <button class="like-btn ${photo.isLiked ? 'liked' : ''}" onclick="toggleLike(${realIndex})">
                  ❤️ <span>${photo.likes || 0}</span>
                </button>
                <button class="share-btn" onclick="sharePhoto('${photo.title}', '${photo.imageUrl}')">
                  🔗 Share
                </button>
              </div>
              <div class="action-group">
                <a href="${photo.imageUrl}" download="${photo.title}.jpg" class="download-btn">Download</a>
                <button class="delete-btn" onclick="deletePhoto(${realIndex})">🗑️</button>
              </div>
            </div>

            <!-- Comments Section -->
            <div class="comments-section">
              <div class="comments-list" id="comment-list-${realIndex}">
                ${commentsHtml}
              </div>
              <div class="comment-input-box">
                <input type="text" id="comment-text-${realIndex}" class="comment-input" placeholder="Write a comment...">
                <button class="comment-submit-btn" onclick="addComment(${realIndex})">Post</button>
              </div>
            </div>

          </div>
        `;
        gallery.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText.includes(cat) || (cat === 'All' && btn.innerText.includes('All'))) {
          btn.classList.add('active');
        }
      });
      loadPhotos();
    }

    function toggleLike(index) {
      let photos = JSON.parse(localStorage.getItem('photobs_photos')) || [];
      if (!photos[index].likes) photos[index].likes = 0;
      
      if (photos[index].isLiked) {
        photos[index].likes -= 1;
        photos[index].isLiked = false;
      } else {
        photos[index].likes += 1;
        photos[index].isLiked = true;
      }
      localStorage.setItem('photobs_photos', JSON.stringify(photos));
      loadPhotos();
    }

    function sharePhoto(title, url) {
      if (navigator.share) {
        navigator.share({
          title: title,
          text: 'Check out this amazing photo on Photobs!',
          url: window.location.href
        }).catch(err => console.log(err));
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Website link copied to clipboard!");
      }
    }

    function addComment(index) {
      const input = document.getElementById(`comment-text-${index}`);
      const text = input.value.trim();
      if (!text) return;

      let photos = JSON.parse(localStorage.getItem('photobs_photos')) || [];
      if (!photos[index].comments) photos[index].comments = [];
      
      let commenterName = prompt("Enter your name for the comment:", "Visitor") || "Anonymous";
      photos[index].comments.push({ name: commenterName, text: text });
      
      localStorage.setItem('photobs_photos', JSON.stringify(photos));
      loadPhotos();
    }

    function openFullImage(url) {
      document.getElementById('full-image-src').src = url;
      document.getElementById('fullview-modal').style.display = 'flex';
    }

    function deletePhoto(index) {
