<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - Photobs</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }
    .bg-card {
      background-color: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

  <div class="bg-card border border-slate-700/50 max-w-md w-full rounded-3xl p-8 shadow-2xl text-center space-y-6">
    <!-- Icon / Graphic -->
    <div class="w-20 h-20 mx-auto bg-blue-600/20 border border-blue-500/30 rounded-full flex items-center justify-center text-blue-400 text-4xl shadow-inner">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <!-- Error Title -->
    <div>
      <h1 class="text-4xl font-extrabold text-white tracking-wider mb-2">404</h1>
      <h2 class="text-xl font-bold text-blue-400">Page Not Found</h2>
      <p class="text-xs text-slate-400 mt-2">
        দুঃখিত, আপনি যে পেজটি খুঁজছেন তা পাওয়া যায়নি বা এটি সরিয়ে ফেলা হয়েছে।
      </p>
    </div>

    <!-- Home Button -->
    <div>
      <a href="./" class="inline-flex items-center gap-2 px-6 py-3 text-sm font-semibold rounded-xl bg-blue-600 hover:bg-blue-700 text-white shadow-lg transition transform hover:scale-105">
        <i class="fa-solid fa-house"></i> Go to Homepage
      </a>
    </div>
  </div>

</body>
</html>
